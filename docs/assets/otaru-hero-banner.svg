<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Dark Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#111726" />
      <stop offset="45%" stop-color="#080b11" />
      <stop offset="100%" stop-color="#030407" />
    </radialGradient>

    <!-- Cyan Ambient Flare -->
    <radialGradient id="cyanFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Ambient Flare -->
    <radialGradient id="goldFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6d365" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#fda085" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gradient for Primary Typography -->
    <linearGradient id="textMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.7" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#f6d365" stop-opacity="0.6" />
    </linearGradient>

    <!-- Technical Micro Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
      <circle cx="30" cy="30" r="0.8" fill="#00f2fe" fill-opacity="0.2" />
    </pattern>

    <pattern id="dotMatrix" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.6" fill="#ffffff" fill-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Base Card Container -->
  <rect width="1200" height="460" rx="16" fill="#030407" />
  <rect width="1200" height="460" rx="16" fill="url(#bgGlow)" />
  <rect width="1200" height="460" rx="16" fill="url(#gridPattern)" />
  <rect width="1200" height="460" rx="16" fill="url(#dotMatrix)" />

  <!-- Ambient Light Orbs -->
  <ellipse cx="320" cy="180" rx="260" ry="160" fill="url(#cyanFlare)" />
  <ellipse cx="880" cy="180" rx="260" ry="160" fill="url(#goldFlare)" />

  <!-- Precision Blueprint Guidelines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="30" y1="30" x2="1170" y2="30" />
    <line x1="30" y1="430" x2="1170" y2="430" />
    <line x1="30" y1="30" x2="30" y2="430" />
    <line x1="1170" y1="30" x2="1170" y2="430" />
  </g>

  <!-- Corner Caliper Crosshairs -->
  <g stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.8">
    <path d="M 22 30 L 38 30 M 30 22 L 30 38" />
    <path d="M 1162 30 L 1178 30 M 1170 22 L 1170 38" />
  </g>
  <g stroke="#f6d365" stroke-width="1.5" stroke-opacity="0.8">
    <path d="M 22 430 L 38 430 M 30 422 L 30 438" />
    <path d="M 1162 430 L 1178 430 M 1170 422 L 1170 438" />
  </g>

  <!-- Concentric Orbital Circles -->
  <circle cx="600" cy="220" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <circle cx="600" cy="220" r="200" fill="none" stroke="#00f2fe" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="4,8" />

  <!-- Inner High-Contrast Frame Card -->
  <rect x="46" y="46" width="1108" height="368" rx="12" fill="#080c14" fill-opacity="0.6" stroke="url(#cardBorder)" stroke-width="1.2" />

  <!-- Top Metadata Bar -->
  <g transform="translate(70, 78)">
    <!-- Active Status Pulse Node -->
    <circle cx="6" cy="6" r="4" fill="#00f2fe" />
    <circle cx="6" cy="6" r="8" fill="none" stroke="#00f2fe" stroke-opacity="0.5" />
    <text x="24" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700" fill="#00f2fe" letter-spacing="2">SYS.ONLINE // SPECIMEN 00-OTR</text>

    <!-- Geographic Location Coordinates -->
    <text x="530" y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" fill="#64748b" letter-spacing="3">LAT 43°11'26"N ⬡ LONG 140°59'48"E — OTARU ARCHIVE</text>

    <!-- Architecture Standard -->
    <text x="1060" y="10" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">EVENT-DRIVEN MONOLITH // V2.4</text>
  </g>

  <!-- Horizontal Divider -->
  <line x1="70" y1="100" x2="1130" y2="100" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Center Typography & Brand Identity -->
  <g transform="translate(600, 215)" text-anchor="middle">
    <!-- Japanese Kanji Header -->
    <text y="-52" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="14" font-weight="700" fill="#00f2fe" fill-opacity="0.8" letter-spacing="8">
      小 樽 工 藝 系 統
    </text>

    <!-- Illuminated Main Brand Title -->
    <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif" font-size="78" font-weight="900" fill="url(#textMetallic)" letter-spacing="24">
      OTARU
    </text>

    <!-- Subtitle Line -->
    <g transform="translate(0, 68)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="700" fill="#cbd5e1" letter-spacing="5">
        DIGITAL HOUSE <tspan fill="#00f2fe">╳</tspan> COMMERCE PLATFORM
      </text>
      <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-style="italic" fill="#64748b" letter-spacing="1">
        "Where heavy-gauge physical craftsmanship converges with immutable digital state."
      </text>
    </g>
  </g>

  <!-- Left Telemetry Pillar -->
  <g transform="translate(76, 155)">
    <rect x="0" y="0" width="136" height="88" rx="6" fill="#030712" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <text x="12" y="20" font-family="monospace" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">SPECIMEN CORE</text>
    <text x="12" y="38" font-family="monospace" font-size="10" font-weight="600" fill="#38bdf8">0x7F · RFC-7807</text>
    <text x="12" y="54" font-family="monospace" font-size="10" fill="#94a3b8">NFC PROVENANCE</text>
    <text x="12" y="70" font-family="monospace" font-size="10" fill="#94a3b8">WEBGL 3D SPEC</text>
  </g>

  <!-- Right Telemetry Pillar -->
  <g transform="translate(988, 155)">
    <rect x="0" y="0" width="136" height="88" rx="6" fill="#030712" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <text x="12" y="20" font-family="monospace" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">STATE ENGINE</text>
    <text x="12" y="38" font-family="monospace" font-size="10" font-weight="600" fill="#f59e0b">PG SELECT FOR UPD</text>
    <text x="12" y="54" font-family="monospace" font-size="10" fill="#94a3b8">UPSTASH REDIS</text>
    <text x="12" y="70" font-family="monospace" font-size="10" fill="#10b981">99.99% RESILIENT</text>
  </g>

  <!-- Bottom Specification Footer -->
  <line x1="70" y1="352" x2="1130" y2="352" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <g transform="translate(70, 380)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <text font-family="monospace" font-size="9" fill="#64748b" letter-spacing="1.5">FRAMEWORK</text>
      <text y="16" font-family="monospace" font-size="11" font-weight="600" fill="#e2e8f0">NEXT.JS 15.1 (RSC)</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(210, 0)">
      <text font-family="monospace" font-size="9" fill="#64748b" letter-spacing="1.5">RUNTIME ENGINE</text>
      <text y="16" font-family="monospace" font-size="11" font-weight="600" fill="#e2e8f0">REACT 19 + TS 5.7</text>
    </g>

    <!-- Column 3 -->
    <g transform="translate(440, 0)">
      <text font-family="monospace" font-size="9" fill="#64748b" letter-spacing="1.5">DATA PERSISTENCE</text>
      <text y="16" font-family="monospace" font-size="11" font-weight="600" fill="#e2e8f0">POSTGRESQL + PRISMA</text>
    </g>

    <!-- Column 4 -->
    <g transform="translate(680, 0)">
      <text font-family="monospace" font-size="9" fill="#64748b" letter-spacing="1.5">EDGE ORCHESTRATION</text>
      <text y="16" font-family="monospace" font-size="11" font-weight="600" fill="#e2e8f0">UPSTASH DISTRIBUTED</text>
    </g>

    <!-- Column 5 -->
    <g transform="translate(920, 0)">
      <text font-family="monospace" font-size="9" fill="#64748b" letter-spacing="1.5">PHYSICAL INTEGRATION</text>
      <text y="16" font-family="monospace" font-size="11" font-weight="600" fill="#00f2fe">WEB NFC NTAG-424</text>
    </g>
  </g>
</svg>
